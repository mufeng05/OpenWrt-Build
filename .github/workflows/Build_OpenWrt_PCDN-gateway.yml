name: Build OpenWrt PCDN gateway

on:
  push:
    paths:
      - products/PCDN-gateway/**
      - scripts/**
      - .github/workflows/build.yml
      - .github/workflows/Build_OpenWrt_PCDN-gateway.yml
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      product: PCDN-gateway
    permissions:
      contents: write
